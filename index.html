<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div id="loginScreen" class="hidden">
        <h2>Zaloguj się, aby kontynuować</h2>
        <!-- future login input -->
    </div>
    <section class="calendar-box">
        <div class="callback"></div>
        <section class="calendar-header">
            <button id="prevMonth">Previous Month</button>
            <h2 id="dateDisplay"></h2>
            <h2 id="chosenMonth"></h2>
            <button id="nextMonth">Next Month</button>
        </section>
        <section id="calendar">
            <table id="calendarTable">
                <tbody id="calendarBody"></tbody>
            </table>
        </section>
        <div class="actionComm hidden">
            <button id="closeButton">X</button>
            <div id="actionContent">
                <h2 id="actionDate">Action Date</h2>
                <label for="actionTittle">Action Title:</label>
                <input type="text" id="actionTittle">
                <label for="categoryId">Category:</label>
                <select name="categoryName" id="categoryId">
                    <option value="1">Colleague</option>
                    <option value="2">Work</option>
                </select>
                <label for="timeInputStarts">Start Time:</label>
                <input type="time" id="timeInputStarts">
                <label for="timeInputEnds">End Time:</label>
                <input type="time" id="timeInputEnds">
                <label for="textInput">Descriptions:</label>
                <input type="text" id="textInput" placeholder="Enter text">
                <button id="showMore">Category Manager</button>
                <button id="saveButton">Save</button>
                
            </div>
        </div>  
        
    </section>
    <div class="eventDescription">
        <Button id="closeDetailsButton">Hide</Button>
        <div id="detailsDiv">  
            <h2 id="detailTitle"></h2>
            <div class="detail-meta">
                <span id="detailDate"></span> | <span id="detailTime"></span> | <span id="detailCategory"></span>
            </div>
            <p id="detailDesc"></p>
            <button id="deletingButton">Delete</button>
            <button id="modifyButton">Modify Event</button>
        </div>
        <div id="additionalInputs">
                    <label for="categorySelect">Category:</label>
                    <select id="categorySelect">
                        <option value="1">Colleague</option>
                        <option value="2">Work</option>
                    </select>
                    <label for="colorCategory">Changing Color(of category):</label>
                    <input type="color" id="colorCategory">
                    <button id="changeColorButton">Change Color</button>
                    <label for="newCategory">Adding new category:</label>
                    <input type="text" id="newCategory" placeholder="-- Add New category --">
                    <label for="colorNewCategory">Color of new category:</label>
                    <input type="color" id="colorNewCategory">
                    <button id="addCategoryButton">Add Category</button>
                    <label for="removeCategory">Removing category:</label>
                    <select id="removeCategory">
                        <option value="1">Colleague</option>
                        <option value="2">Work</option>
                    </select>
                    <button id="removeCategoryButton">Remove Category</button>
                </div>
    </div>
    <div id="rightSidebar" class="right-sidebar">
        <button id="rightSidebarToggle" class="rightSidebar-toggle" title="Check upcoming deadlines">⏳</button>
        <div class="rightSidebar-content">
            <h2>Upcoming Deadlines</h2>
            <div id="rightUpcomingEventsList"></div>
            <div id="showOnlyContainer">
            <select id="Show only"></select>
            </div>
        </div>
    </div>
    <div id="leftSidebar" class="left-sidebar">
        <button id="leftSidebarToggle" class="leftSidebar-toggle" title="Settings">⚙️</button>
        <div class="leftSidebar-content">  
                <button id="generalSettingsButton">General Settings</button>
                <button id="notificationSettingsButton">Notification Settings</button>
                <button id="accountButton">Account</button>
        </div>
    </div>
    <div class="leftSidebarOnlickEvents">
        <div id="generalSettings">
            <button class="settingsCloseBtn">X</button>
            <label for="themeSelect">Theme:</label>
            <select id="themeSelect">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <label for="languageSelect">Language:</label>
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
                <option value="pl">Polski</option>
            </select>
            <label for="changesSound">Mute Notifications:</label>
            <button id="changesSound">Mute</button>
        </div>
        <div id="notificationSettings">
            <button class="settingsCloseBtn">X</button>
            <label for="emailNotifications">Email Notifications:</label>
            <button id="emailNotifications">Enable/Disable</button>
            <label for="userEmail">User Email:</label>
            <input type="email" id="userEmail" placeholder="Enter your email">
            <label for="pushNotifications">Push Notifications:</label>
            <button id="pushNotifications">Enable/Disable</button>
        </div>
        <div id="accountSettings">
            <button class="settingsCloseBtn">X</button>
            <label for="username">Change Username:</label>
            <input type="text" id="username" placeholder="Enter your username">
            <label for="password">Change Password:</label>
            <input type="password" id="password" placeholder="Enter your password">
            <input type="password" id="confirmPassword" placeholder="Confirm your password">
            <button id="changePasswordButton">Change Password</button>
        </div>
    </div>
    <script src="base.js"></script>
</body>
</html>
